services:

  db:
    container_name: foodgram-db
    image: postgres:13.10-alpine
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data/

  backend:
    container_name: foodgram-backend
    image: zxcuwuu/foodgram_backend:latest
    build: ../backend
    env_file:
      - .env
    volumes:
      - static_value:/app/staticfiles/
      - media_value:/app/media/
      - ../data:/app/data:ro
    depends_on:
      - db
    command: >
      sh -c "until python -c \"import os, psycopg2; psycopg2.connect(dbname=os.environ['POSTGRES_DB'], user=os.environ['POSTGRES_USER'], password=os.environ['POSTGRES_PASSWORD'], host=os.environ.get('DB_HOST', 'db'), port=os.environ.get('DB_PORT', '5432'))\"; do sleep 1; done &&
             python manage.py migrate &&
             python manage.py load_ingredients &&
             python manage.py create_demo_data &&
             python manage.py collectstatic --noinput &&
             gunicorn foodgram.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    container_name: foodgram-front
    build: ../frontend
    volumes:
      - ../frontend/:/app/result_build/

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static_value:/usr/share/nginx/backend_static/
      - media_value:/usr/share/nginx/html/media/
    depends_on:
      - backend

volumes:
  pg_data:
  static_value:
  media_value:
