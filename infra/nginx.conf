server {
    listen 80;
    server_name zxczxc.servequake.com 158.160.201.43;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zxczxc.servequake.com 158.160.201.43;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/zxczxc.servequake.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zxczxc.servequake.com/privkey.pem;

    location /api/docs/ {
        alias /usr/share/nginx/html/api/docs/;
        index redoc.html;
        try_files $uri $uri/ /api/docs/redoc.html;
    }

    location /static/admin/ {
        alias /usr/share/nginx/django-static/admin/;
    }

    location /static/rest_framework/ {
        alias /usr/share/nginx/django-static/rest_framework/;
    }

    location /static/ {
        root /usr/share/nginx/html;
    }

    location /media/ {
        root /usr/share/nginx/html;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000/admin/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }
}
